services:
  # Firebase Emulator Suite (Auth + Firestore + Storage) — официальные эмуляторы Google.
  # Заменяет удалённые/устаревшие сторонние образы (spurin/firebase-auth-emulator,
  # mtlynch/firestore-emulator, oittaa/gcp-storage-emulator), часть которых больше
  # не существует в Docker Hub.
  firebase-emulators:
    build:
      context: ./docker/firebase
    container_name: rhythm-firebase-emulators
    ports:
      - '4000:4000' # Emulator UI
      - '8080:8080' # Firestore
      - '9099:9099' # Auth
      - '9199:9199' # Storage
    volumes:
      # Кэш скачанных бинарников эмуляторов (Firestore JAR и т.д.) — чтобы не
      # перекачивать при каждом пересоздании контейнера.
      - firebase-emulator-cache:/root/.cache/firebase/emulators
      - ./firebase.json:/firebase/firebase.json:ro
      - ./storage.rules:/firebase/storage.rules:ro

  # Redis — кэш сессий и signup-данных
  redis:
    image: redis:7-alpine
    container_name: rhythm-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  firebase-emulator-cache:
  redis-data:
